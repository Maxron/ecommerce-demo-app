services:
  mysql:
    image: 'mysql:8.0'
    container_name: 'ecommerce-demo-mysql'
    restart: always
    environment:
      MYSQL_DATABASE: ecommerce
      MYSQL_USER: ecommerce
      MYSQL_PASSWORD: ecommerce
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "ecommerce", "--password=ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    container_name: 'ecommerce-demo-app'
    restart: always
    depends_on:
       mysql:
         condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  mysql_data: